    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://priyamraj.com/#person",
      "name": "Priyam Raj",
      "url": "https://priyamraj.com/",
      "image": "https://priyamraj.com/media/times-square-priyam.jpg",
      "jobTitle": "Creator Software Entrepreneur",
      "worksFor": { "@type": "Organization", "name": "Warplabs", "url": "https://warplabs.co" },
      "description": "Entrepreneur from Bangalore, India. Sold Morise.ai and Timenite; now building Vid.AI, TypeVoice, moonn, TubeMagic, and logs.so.",
      "address": { "@type": "PostalAddress", "addressLocality": "Bangalore", "addressCountry": "IN" },

</head>
<body>
    <main class="stage">
        <div class="card" id="card">
            <button class="face front" type="button" id="turn" aria-expanded="false" aria-controls="back">
                <span class="rule" aria-hidden="true"></span>
                <h1 class="name">Priyam Raj</h1>
                <p class="line">Builds software for creators</p>
                <p class="place">Bangalore</p>
                <span class="rule" aria-hidden="true"></span>
                <span class="hint" aria-hidden="true">Turn over</span>
            </button>

            <section class="face back" id="back" aria-label="Details">
                <p class="studio"><a href="https://warplabs.co" target="_blank" rel="noreferrer">Warplabs</a></p>
                <p class="works"><a href="https://vid.ai" target="_blank" rel="noreferrer">Vid.AI</a> · <a href="https://typevoice.ai" target="_blank" rel="noreferrer">TypeVoice</a> · <a href="https://logs.so" target="_blank" rel="noreferrer">logs.so</a> · <a href="https://moonn.com" target="_blank" rel="noreferrer">moonn</a> · <a href="https://tubemagic.com" target="_blank" rel="noreferrer">TubeMagic</a></p>
                <p class="figures">Two acquisitions &nbsp;·&nbsp; $1M+ a year &nbsp;·&nbsp; billions of views</p>
                <p class="contact"><a href="mailto:hello@priyamraj.com">hello@priyamraj.com</a></p>
                <p class="links"><a href="https://x.com/priymrj" target="_blank" rel="noreferrer">X</a> · <a href="https://youtube.com/@priyam-raj" target="_blank" rel="noreferrer">YouTube</a> · <a href="https://instagram.com/priymrj" target="_blank" rel="noreferrer">Instagram</a> · <a href="https://priyamventures.com" target="_blank" rel="noreferrer">Ventures</a> · <a href="/story">Story</a></p>
                <button class="turn-back" type="button" id="turn-back" aria-label="Turn the card back over">&larr;</button>
            </section>
        </div>
    </main>

    <script>
        (() => {
            const card = document.getElementById('card');
            const turn = document.getElementById('turn');
            const back = document.getElementById('turn-back');
            const flip = (on) => {
                card.classList.toggle('is-flipped', on);
                turn.setAttribute('aria-expanded', String(on));
                (on ? document.querySelector('#back a') : turn).focus({ preventScroll: true });
            };
            turn.addEventListener('click', () => flip(true));
            back.addEventListener('click', () => flip(false));
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && card.classList.contains('is-flipped')) flip(false); });
        })();
    </script>
</body>
</html>
